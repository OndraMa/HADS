    name: Create daily full ChatGPT report
  upload_markdown:
    name: Upload Markdown report
  upload_chatgpt_txt:
    name: Upload TXT report for ChatGPT
  advisor_use_ha_conversation:
    name: Use a Home Assistant conversation agent for case chat
  advisor_agent_id:
    name: Conversation agent ID (blank = default)
