    name: Deprecated — bypassing backup is not permitted
  recorder_maintenance_enabled:
    name: Enable local SQLite history maintenance plans
  recorder_sqlite_path:
    name: Verified active SQLite DB relative to configuration
  ai_background_research:
    name: Enable paid background AI research
  ai_max_output_tokens:
    name: Maximum output tokens including reasoning
  ai_daily_call_limit:
