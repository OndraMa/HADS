  watchdog_enabled:
    name: Enable continuous watchdog
  watchdog_interval_minutes:
    name: Quick scan interval (minutes)
  quick_log_lines:
    name: Log lines used by a quick scan
  quick_include_addon_logs:
    name: Include app/add-on logs in quick scans
  log_lines:
    name: Lines retained from each log source
  include_host_logs:
    name: Include host logs
  include_addon_logs:
    name: Include all app/add-on logs
  include_service_logs:
    name: Include DNS, audio and multicast logs
  keep_raw_days:
    name: Raw import retention (days)
  keep_exports_days:
    name: Export retention (days)
  metrics_retention_days:
    name: Detailed metrics retention (days)
  collector_history_days:
    name: Collection history retention (days)
  max_upload_mb:
    name: Maximum uploaded file size (MB)
  yaml_audit_enabled:
    name: Enable deep YAML audit
  yaml_entity_reference_check:
    name: Check static entity references
  yaml_max_file_kb:
    name: Maximum YAML file size (KB)
  correlation_window_minutes:
    name: Correlation time window (minutes)
  fix_observation_hours:
    name: Default post-fix observation period (hours)
  notify_p1_p2:
    name: Create HA notifications for new P1/P2 cases
  redact_local_ips_in_exports:
    name: Redact local IP addresses in exports
  onedrive_enabled:
    name: Enable OneDrive export
  onedrive_config_entry_id:
    name: OneDrive config entry ID
  onedrive_destination_folder:
    name: Destination folder in the Home Assistant OneDrive area
  hads2_compat_folder:
