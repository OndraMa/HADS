    name: Allow a planned Home Assistant Core restart
  repair_watch_hours:
    name: Automatic repair verification window (hours)
  auto_scan_after_repair:
    name: Run a quick scan automatically after repair
  openai_enabled:
    name: Enable the OpenAI second analysis layer
  openai_api_key:
    name: OpenAI API key
  openai_model:
    name: OpenAI model used for analysis
  openai_web_search_enabled:
    name: Use current web search during analysis
  openai_allowed_domains:
    name: Comma-separated allowed web domains
  ha_dashboard_enabled:
    name: Publish HADS 4 sensors to Home Assistant
  ha_dashboard_publish_seconds:
    name: Dashboard sensor refresh interval (seconds)
  observer_enabled:
    name: Enable live Home Assistant WebSocket Observer
  observer_reconnect_seconds:
    name: Observer reconnect interval (seconds)
  dependency_graph_enabled:
    name: Build dependency graph and blast radius
  knowledge_base_enabled:
    name: Store local memory of causes, fixes and outcomes
  current_health_window_hours:
    name: Current Health time window (hours)
  ai_mode:
    name: AI mode (observe / officer / autopilot)
  ai_tool_max_rounds:
    name: Maximum AI Officer tool rounds
  first_officer_enabled:
    name: Enable the First Officer captain queue
  first_officer_grace_minutes:
    name: Restart grace period (minutes)
  automatic_repair_planner:
    name: Automatically prepare evidence-backed repair plans
  automatic_planner_limit:
    name: Maximum root cases processed per audit
  rescue_onedrive_folder:
    name: OneDrive folder for repair rescue packages
  rescue_remote_verify_service:
    name: Service used to verify the remote OneDrive file
  ha_mcp_url:
    name: Direct HA-MCP endpoint (blank disables the connector)
  ha_mcp_token:
    name: HA-MCP token when required
  hamster_mcp_url:
    name: Hamster MCP endpoint (blank disables the connector)
  hamster_mcp_token:
    name: Hamster MCP token when required
  hadocs_api_url:
    name: HADocs read-only JSON API
  hadocs_token:
    name: HADocs read-only API token
  automation_inspector_api_url:
    name: Automation Inspector read-only API
  automation_inspector_token:
    name: Automation Inspector read-only API token
  external_connector_timeout_seconds:
    name: External diagnostics timeout (seconds)
  ai_call_limits_enabled:
    name: Limit daily AI requests
    description: When disabled HADS applies no daily call cap; available API credit can be consumed.
