name: HADS Hermes ARM64 verification
on:
  push:
    branches: [hermes-2-rc2-cloud-verification]
    paths:
      - .github/workflows/hermes-arm64-verification.yml
      - cloud-hermes/ci/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hads-hermes-arm64-verification
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact triggering commit (no retained credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Record real runner capabilities
        run: |
          uname -smr
          python --version
          node --version
          docker version
          python - <<'PY'
          import ctypes, json, pathlib
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          abi = libc.syscall(444, 0, 0, 1)
          print(json.dumps({"landlock_abi": abi, "errno": ctypes.get_errno() if abi < 0 else 0}))
          print("\n".join(x for x in pathlib.Path("/proc/meminfo").read_text().splitlines() if x.startswith(("MemTotal:", "MemAvailable:"))))
          PY
      - name: Verify and safely extract reviewed RC1 source
        run: |
          cd cloud-hermes
          sha256sum --check SHA256SUMS
          python - <<'PY'
          import pathlib, stat, zipfile
          target = pathlib.Path("source-rc1").resolve()
          with zipfile.ZipFile("HADS_Hermes_2.0.0-rc1-source.zip") as archive:
              assert sum(i.file_size for i in archive.infolist()) <= 32 * 1024 * 1024
              for item in archive.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and ".." not in p.parts and "\\" not in item.filename and ":" not in item.filename
                  assert not stat.S_ISLNK(item.external_attr >> 16)
                  assert (target / item.filename).resolve().is_relative_to(target)
              archive.extractall(target)
          print("Verified source extracted; this is not an installable RC2.")
          PY
          cp -a ci/overlay/. source-rc1/
          python - <<'PY'
          from pathlib import Path
          root = Path('source-rc1')
          legacy = root / 'hermes_isolation.py'
          legacy.unlink()
          main = root / 'hads4.py'
          value = main.read_text()
          assert value.count('VERSION = "2.0.0-rc1"') == 1
          main.write_text(value.replace('VERSION = "2.0.0-rc1"', 'VERSION = "2.0.0-rc2"', 1))
          PY
      - name: Install test dependencies (no model SDK calls)
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 "websocket-client>=1.8,<2"
      - name: Python regression suite
        id: python_tests
        working-directory: cloud-hermes/source-rc1
        run: |
          PYTHONPATH=.. python ../ci/run_regressions.py
          python -m compileall -q .
      - name: UI contracts and syntax
        id: ui_tests
        if: ${{ !cancelled() }}
        working-directory: cloud-hermes/source-rc1
        run: |
          for script in web/*.js; do node --check "$script"; done
          for script in tests/*.mjs; do node "$script"; done
      - name: Build pinned Hermes with mandatory sandbox smoke test
        id: image_build
        if: ${{ !cancelled() }}
        timeout-minutes: 28
        working-directory: cloud-hermes/source-rc1
        run: |
          timeout --signal=TERM --kill-after=30s 25m docker build --progress=plain --tag hads-hermes:cloud-test .
      - name: "Three real worker steps: ENOSYS Landlock, 512 MiB, no network"
        id: worker
        if: ${{ !cancelled() && steps.image_build.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          docker create --name hads-hermes-smoke --network none --memory 512m --memory-swap 512m --pids-limit 64 --cpus 1 --read-only --tmpfs /tmp:rw,nosuid,nodev,size=32m,mode=1777 --tmpfs /opt/hermes-root/tmp:rw,nosuid,nodev,size=32m,mode=1777 --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add SYS_CHROOT --security-opt no-new-privileges --entrypoint python3 hads-hermes:cloud-test /app/hermes_no_landlock_smoke.py
          hads_status=0
          timeout --signal=TERM --kill-after=10s 180s docker start --attach hads-hermes-smoke || hads_status=$?
          docker inspect --format '{{json .State}}' hads-hermes-smoke
          exit "$hads_status"
      - name: Report exact check outcomes (never publish a release)
        if: ${{ always() }}
        env:
          PYTHON_OUTCOME: ${{ steps.python_tests.outcome }}
          UI_OUTCOME: ${{ steps.ui_tests.outcome }}
          BUILD_OUTCOME: ${{ steps.image_build.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("# HADS Hermes ARM64 verification\n\n")
              for key in ("PYTHON_OUTCOME", "UI_OUTCOME", "BUILD_OUTCOME", "WORKER_OUTCOME"):
                  report.write(f"- {key}: {os.environ.get(key, 'not run')}\n")
              report.write("\nActual upstream Hermes uses a local fake model, no paid API. No production HAOS access, no deployment, no release.\n")
              report.write("The 384 MiB hard worker AS limit plus 192 MiB system reserve defines the 576 MiB admission gate; this is not a guarantee of combined HAOS/Pi memory.\n")
              report.write("Host/BuildKit Landlock failures remain failures; no protection bypass is enabled.\n")
          PY
          docker rm --force hads-hermes-smoke >/dev/null 2>&1 || true
