name: HADS Next RC3 install recovery
on:
  push:
    branches: [codex/hads-next-install-recovery]
    paths:
      - hads-next/scripts/**
      - hads-next/lab/recovery_*.py
      - hads-next/tests/**
      - .github/workflows/hads-next-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hads-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Offline and negative safety regressions
        working-directory: hads-next
        run: |
          python -m pip install websockets==16.0
          python scripts/check.py
      - name: Real helper and released installer, isolated fake HA CLI
        working-directory: hads-next
        run: python scripts/recovery_smoke.py --architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: recovery-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            hads-next/docs/evidence/offline-tests.json
            hads-next/docs/evidence/recovery-${{ matrix.architecture }}.json
          retention-days: 7
