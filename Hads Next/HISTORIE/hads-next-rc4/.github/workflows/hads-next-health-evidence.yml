name: HADS Next diagnostic evidence regressions
on:
  push:
    branches: [codex/hads-next-health-evidence]
    paths:
      - hads-next/src/**
      - hads-next/tests/**
      - .github/workflows/hads-next-health-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install websockets==16.0
      - name: Offline and real HTTP-WebSocket wire contracts, no HAOS
        working-directory: hads-next
        run: python scripts/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: health-evidence-${{ matrix.architecture }}-${{ github.sha }}
          path: hads-next/docs/evidence/offline-tests.json
          retention-days: 7
