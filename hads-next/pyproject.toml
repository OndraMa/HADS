[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hads-next"
version = "1.0.0rc6"
description = "HADS Next autonomous native diagnostics and approved repairs"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
native-ws = ["websockets>=16,<17"]

[tool.setuptools.packages.find]
where = ["src"]
