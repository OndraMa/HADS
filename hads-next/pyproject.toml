[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hads-next"
version = "0.2.0.dev1"
description = "Offline-first HADS Next development vertical slice"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
native-ws = ["websockets>=16,<17"]

[tool.setuptools.packages.find]
where = ["src"]
